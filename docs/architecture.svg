<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="ui-monospace,monospace" font-size="12">
  <rect width="900" height="560" fill="#09090b"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" fill="#a1a1aa" font-size="13" font-weight="600">Regulus — System Architecture</text>

  <!-- ── User / Frontend ── -->
  <rect x="30" y="60" width="130" height="44" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
  <text x="95" y="78" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">Browser</text>
  <text x="95" y="94" text-anchor="middle" fill="#6366f1" font-size="10">Next.js / Vercel</text>

  <!-- ── FastAPI ── -->
  <rect x="240" y="60" width="130" height="44" rx="6" fill="#14532d" stroke="#16a34a" stroke-width="1.5"/>
  <text x="305" y="78" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">FastAPI</text>
  <text x="305" y="94" text-anchor="middle" fill="#4ade80" font-size="10">Cloud Run</text>

  <!-- ── Firestore ── -->
  <rect x="450" y="60" width="130" height="44" rx="6" fill="#1c1917" stroke="#d97706" stroke-width="1.5"/>
  <text x="515" y="78" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">Firestore</text>
  <text x="515" y="94" text-anchor="middle" fill="#f59e0b" font-size="10">runs / events / results</text>

  <!-- ── Pub/Sub ── -->
  <rect x="660" y="60" width="130" height="44" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="725" y="78" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">Pub/Sub</text>
  <text x="725" y="94" text-anchor="middle" fill="#8b5cf6" font-size="10">job queue</text>

  <!-- arrows top row -->
  <line x1="160" y1="82" x2="238" y2="82" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="82" x2="448" y2="82" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="82" x2="658" y2="82" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Worker ── -->
  <rect x="240" y="170" width="130" height="44" rx="6" fill="#14532d" stroke="#16a34a" stroke-width="1.5"/>
  <text x="305" y="188" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">RunWorker</text>
  <text x="305" y="204" text-anchor="middle" fill="#4ade80" font-size="10">same Cloud Run</text>

  <!-- Pub/Sub → Worker -->
  <line x1="725" y1="104" x2="725" y2="145" stroke="#52525b" stroke-width="1.5"/>
  <line x1="725" y1="145" x2="372" y2="145" stroke="#52525b" stroke-width="1.5"/>
  <line x1="372" y1="145" x2="372" y2="168" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FastAPI → Worker (same process) -->
  <line x1="305" y1="104" x2="305" y2="168" stroke="#52525b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- ── Orchestrator ── -->
  <rect x="240" y="280" width="130" height="44" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="305" y="298" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">Orchestrator</text>
  <text x="305" y="314" text-anchor="middle" fill="#818cf8" font-size="10">autonomous loop</text>

  <!-- Worker → Orchestrator -->
  <line x1="305" y1="214" x2="305" y2="278" stroke="#52525b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Agents row ── -->
  <!-- Research -->
  <rect x="60" y="390" width="120" height="44" rx="6" fill="#1c1917" stroke="#0891b2" stroke-width="1.5"/>
  <text x="120" y="408" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600">Research</text>
  <text x="120" y="424" text-anchor="middle" fill="#22d3ee" font-size="10">Agent</text>

  <!-- Simulation -->
  <rect x="220" y="390" width="120" height="44" rx="6" fill="#1c1917" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="280" y="408" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">Simulation</text>
  <text x="280" y="424" text-anchor="middle" fill="#8b5cf6" font-size="10">Agent</text>

  <!-- Decision -->
  <rect x="380" y="390" width="120" height="44" rx="6" fill="#1c1917" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="408" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">Decision</text>
  <text x="440" y="424" text-anchor="middle" fill="#34d399" font-size="10">Agent</text>

  <!-- Orchestrator → agents -->
  <line x1="270" y1="324" x2="120" y2="388" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="295" y1="324" x2="280" y2="388" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="340" y1="324" x2="440" y2="388" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── PGM Engine ── -->
  <rect x="220" y="490" width="120" height="44" rx="6" fill="#1c1917" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="280" y="508" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">PGM Engine</text>
  <text x="280" y="524" text-anchor="middle" fill="#8b5cf6" font-size="10">NumPy / SciPy</text>

  <!-- Simulation → PGM -->
  <line x1="280" y1="434" x2="280" y2="488" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Gemini ── -->
  <rect x="580" y="390" width="130" height="44" rx="6" fill="#1c1917" stroke="#d97706" stroke-width="1.5"/>
  <text x="645" y="408" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">Gemini API</text>
  <text x="645" y="424" text-anchor="middle" fill="#f59e0b" font-size="10">gemini-2.5-flash</text>

  <!-- agents → Gemini -->
  <line x1="180" y1="412" x2="578" y2="412" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="340" y1="412" x2="578" y2="412" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="500" y1="412" x2="578" y2="412" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Orchestrator → Firestore (write events) -->
  <line x1="370" y1="302" x2="448" y2="100" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="660" y="280" width="210" height="120" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="765" y="300" text-anchor="middle" fill="#71717a" font-size="10" font-weight="600">LEGEND</text>
  <line x1="675" y1="316" x2="705" y2="316" stroke="#52525b" stroke-width="1.5"/>
  <text x="712" y="320" fill="#a1a1aa" font-size="10">sync call</text>
  <line x1="675" y1="336" x2="705" y2="336" stroke="#52525b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="712" y="340" fill="#a1a1aa" font-size="10">async / event</text>
  <rect x="675" y="350" width="14" height="10" rx="2" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="696" y="360" fill="#a1a1aa" font-size="10">Frontend / Infra</text>
  <rect x="675" y="368" width="14" height="10" rx="2" fill="#14532d" stroke="#16a34a" stroke-width="1"/>
  <text x="696" y="378" fill="#a1a1aa" font-size="10">Backend (Cloud Run)</text>
  <rect x="675" y="386" width="14" height="10" rx="2" fill="#1c1917" stroke="#7c3aed" stroke-width="1"/>
  <text x="696" y="396" fill="#a1a1aa" font-size="10">Agents / PGM</text>

  <!-- arrowhead marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#52525b"/>
    </marker>
  </defs>
</svg>
